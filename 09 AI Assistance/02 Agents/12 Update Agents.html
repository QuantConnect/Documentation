<p>Follow these steps to update the Agents in your organization:</p>
<ol>
  <li>Log in to the <a href="/terminal">Algorithm Lab</a>.</li>
  <li>In the left navigation bar, click <span class="page-section-name">Organization &gt; Agents</span>.</li>
  <li>Click an Agent.</li>
  <li>Edit the Agent configuration.</li>
  <li>Click <span class="button-name">Save Changes</span>.</li>
</ol>
