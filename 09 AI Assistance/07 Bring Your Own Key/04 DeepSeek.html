<p>To run the Assistants on DeepSeek's models, follow these steps to get an API key:</p>
<ol>
  <li><a href="https://platform.deepseek.com/sign_in" rel="nofollow" target="_blank">Log in or create an account</a> on the DeepSeek Open Platform.</li>
  <li>On the <a href="https://platform.deepseek.com/api_keys" rel="nofollow" target="_blank">API keys</a> page, click <span class="button-name">Create new API key</span>.</li>
  <li>Copy the key and paste it into the <span class="field-name">Token</span> field in the Organization's <span class="page-section-name">Secrets</span>.</li>
</ol>
