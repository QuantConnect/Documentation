<p>To run the Assistants on Google's Gemini models, follow these steps to get an API key:</p>
<ol>
  <li><a href="https://aistudio.google.com" rel="nofollow" target="_blank">Log in or create an account</a> on Google AI Studio.</li>
  <li>On the <a href="https://aistudio.google.com/apikey" rel="nofollow" target="_blank">API keys</a> page, click <span class="button-name">Create API key</span>.</li>
  <li>Copy the key and paste it into the <span class="field-name">Token</span> field in the Organization's <span class="page-section-name">Secrets</span>.</li>
</ol>
