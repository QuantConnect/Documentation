<p>To run the Assistants on a model from Groq, follow these steps to get an API key:</p>
<ol>
  <li><a href="https://console.groq.com/login" rel="nofollow" target="_blank">Log in or create an account</a> on the Groq Console.</li>
  <li>On the <a href="https://console.groq.com/keys" rel="nofollow" target="_blank">API Keys</a> page, click <span class="button-name">Create API Key</span>.</li>
  <li>Copy the key and paste it into the <span class="field-name">Token</span> field in the Organization's <span class="page-section-name">Secrets</span>.</li>
</ol>
