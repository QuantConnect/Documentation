<p>Neither the Bloomberg&trade; Server API (SAPI) nor the Bloomberg&trade; FIX connection provides data. You must use the <a href='/docs/v2/cloud-platform/datasets/quantconnect'>QuantConnect data provider</a>, a third-party data provider such as <a href='/docs/v2/cloud-platform/datasets/polygon'>Polygon</a>, or a broker that provides data.</p>
