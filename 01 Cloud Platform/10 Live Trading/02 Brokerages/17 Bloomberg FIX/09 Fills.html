<p>In live trading, LEAN routes your orders over the FIX session to the prime brokerage that your session points to. The order fills and then routes back to you.</p>

<p>To view how we model Bloomberg&trade; FIX order fills, see <a href="/docs/v2/writing-algorithms/reality-modeling/brokerages/supported-models/bloomberg-fix#04-Fills">Fills</a>.</p>
