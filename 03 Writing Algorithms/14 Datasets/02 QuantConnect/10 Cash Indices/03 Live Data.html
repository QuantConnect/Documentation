<p>The QuantConnect data provider streams live <a href="/docs/v2/cloud-platform/datasets/quantconnect/us-indices">SPX and VIX</a> data from the Cboe MAIN index feed. To receive live data for other indices, you must add a brokerage or a third-party data provider (see <a href="/docs/v2/cloud-platform/datasets">Cloud Platform > Datasets</a>).</p>
